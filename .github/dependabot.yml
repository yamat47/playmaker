# Dependabot configuration for automatic dependency updates
# Policy: always follow the latest (including majors).
# GitHub Actions are out of scope because github-toolkit is referenced at @main.
# The skills in .claude/skills/ are also out of Dependabot's scope; the update-skills workflow plays the same role.
#  - minor / patch: one PR per ecosystem (less noise)
#  - major: individual PRs (deliberately not grouped, so breaking changes are reviewed one at a time)
#  - vitest and @vitest/* alone: one PR including majors (they only work at the same version)
version: 2

updates:
  # npm (pnpm): library/package.json / library/pnpm-lock.yaml
  - package-ecosystem: npm
    directory: /library
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Also raise the range specified in package.json itself to the latest (not just follow the lockfile)
    versioning-strategy: increase
    # Wait 7 days after publication before bumping. pnpm 11 does not install versions published less than
    # a day ago (minimumReleaseAge), so a PR arriving before that fails install. 7 days is the length zizmor
    # requires (dependabot-cooldown) to avoid the period right after publication, when withdrawals and replacements are common
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      # A dependency goes into the first matching group, so this comes before dev-dependencies.
      # Bumping vitest alone conflicts with the plugins, which require the versions to match.
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      # Security updates also arrive one package at a time by default, so group them with the same set.
      vitest-security:
        applies-to: security-updates
        patterns:
          - vitest
          - "@vitest/*"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # Base of the development image (node:<major>-<debian>-slim)
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore(deps-dev)
