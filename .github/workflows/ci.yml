name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチで新しい push があれば実行中の古い run をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# JS アクション(checkout/setup-node 等)を最新の Node 24 ランタイムで動かす
# （Node 20 ランタイムは非推奨。GitHub 強制移行前に先取りする）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# ライブラリ本体は library/ にある
defaults:
  run:
    working-directory: library

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # github-toolkit は自分で管理しているリポジトリなので、タグ固定と Dependabot での更新はやめ、
      # @main を直接追いかける。toolkit 側で上流 action を更新すると、その内容が次の CI からそのまま入る
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: Setup Node.js with pnpm and install dependencies
        # pnpm のバージョンは library/package.json の packageManager から解決され、
        # pnpm install --frozen-lockfile まで実行される
        uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version: 26
          package-json-file: library/package.json
          cache-dependency-path: library/pnpm-lock.yaml
          working-directory: library

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (Vitest)
        run: pnpm run test

      - name: Build (Vite library mode)
        run: pnpm run build
