name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel the running older run when a new push arrives on the same branch
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The library itself lives in library/. Locally it runs inside a Docker container (Makefile), but
# CI runs it directly on the runner because setup-node's pnpm store cache is faster
defaults:
  run:
    working-directory: library

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by SHA as a rule, but github-toolkit is the one exception and tracks @main directly.
      # The author maintains that repository, and pinning upstream actions by SHA and updating them with Dependabot happen on the toolkit side.
      # Changes to the toolkit's main land as is from the next CI run, without going through review
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: Setup Node.js with pnpm and install dependencies
        # The pnpm version is read from packageManager in library/package.json, and Node from .node-version.
        uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version
          package-json-file: library/package.json
          cache-dependency-path: library/pnpm-lock.yaml
          working-directory: library

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (Vitest)
        run: pnpm run test

      - name: Build (Vite library mode)
        run: pnpm run build

  # Fetching and starting Chromium takes time, so run this alongside verify.
  browser-test:
    name: browser test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: Setup Node.js with pnpm and install dependencies
        uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version
          package-json-file: library/package.json
          cache-dependency-path: library/pnpm-lock.yaml
          working-directory: library

      - name: Install Chromium
        # Install the Chromium version that the playwright in the lockfile expects, plus the OS packages to run it.
        # The browser itself is cached per playwright version; on a cache hit, only the OS packages are reinstalled
        uses: yamat47/github-toolkit/actions/setup-playwright-chromium@main
        with:
          working-directory: library

      - name: Browser test (Vitest Browser Mode)
        run: pnpm run test:browser

  # Checks how the workflows are written. zizmor finds missing permissions, script injection,
  # actions not pinned by SHA, and so on. The repository is public, so SARIF could be uploaded
  # to the security tab, but annotations are used so the findings can be read within the PR
  lint-workflows:
    name: lint workflows (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: zizmor
        uses: yamat47/github-toolkit/actions/zizmor@main
        with:
          advanced-security: "false"
          annotations: "true"
