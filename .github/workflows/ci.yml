name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一ブランチで新しい push があれば実行中の古い run をキャンセルする
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ライブラリ本体は library/ にある。ローカルは Docker コンテナの中で動かすが（Makefile）、
# CI は setup-node の pnpm store キャッシュのほうが速いのでランナーで直接動かす
defaults:
  run:
    working-directory: library

jobs:
  verify:
    name: typecheck / lint / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # action は SHA で固定するのが原則だが、github-toolkit だけは例外として @main を直接追いかける。
      # 自分で管理しているリポジトリで、上流 action の SHA 固定と Dependabot での更新は toolkit 側で行うため。
      # toolkit の main の変更は、レビューを通さず次の CI からそのまま入る
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: Setup Node.js with pnpm and install dependencies
        # pnpm のバージョンは library/package.json の packageManager から、Node は .node-version から読む。
        # prepare の build を install で走らせると、後の Build と合わせて 2 回ビルドになるので飛ばす
        uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version
          package-json-file: library/package.json
          cache-dependency-path: library/pnpm-lock.yaml
          working-directory: library
          install-args: --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (Vitest)
        run: pnpm run test

      - name: Build (Vite library mode)
        run: pnpm run build
