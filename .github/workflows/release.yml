# Pushing a tag that starts with v publishes library/ to npm as @yamat47/playmaker.
# Publishing cannot be undone, so tags are put on a main commit that passed CI, and this workflow also runs
# typecheck, lint, and the node tests before publishing. Provenance is attached, so on npm you can trace
# a published version back to this commit of this workflow.
#
# Authentication uses npm trusted publishing (OIDC) and holds no token. In the package settings on npmjs.com,
# this repository, this file name, and the release environment are registered as the trusted publisher
# (see "Distribution" in docs/design.md).
#
# Actions are pinned by SHA as a rule, but github-toolkit is the one exception and tracks @main directly
# (see the comment in ci.yml).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Do not stop in the middle of publishing. If two tags arrive together, publish them in order
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write # Proves identity to npm via OIDC and signs the provenance
    defaults:
      run:
        working-directory: library
    steps:
      - name: Checkout
        uses: yamat47/github-toolkit/actions/checkout@main
        with:
          persist-credentials: false

      - name: Setup Node.js with pnpm and install dependencies
        uses: yamat47/github-toolkit/actions/setup-node-with-pnpm@main
        with:
          node-version-file: .node-version
          package-json-file: library/package.json
          cache-dependency-path: library/pnpm-lock.yaml
          working-directory: library

      - name: Check that the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint (Biome)
        run: pnpm run lint

      - name: Test (Vitest)
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Publish
        # access and provenance are in publishConfig in package.json.
        # A tag checkout is a detached HEAD, so skip the branch check
        run: pnpm publish --no-git-checks
