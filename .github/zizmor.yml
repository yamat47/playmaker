# zizmor configuration (read by both the lint-workflows job in CI and a local docker run).
# Actions are pinned by SHA as a rule, but the author maintains github-toolkit, and pinning upstream by SHA
# and updating happen on the toolkit side, so it stays referenced at @main (see the comment in ci.yml and the README).
rules:
  unpinned-uses:
    config:
      policies:
        "yamat47/github-toolkit/*": ref-pin
        "*": hash-pin
