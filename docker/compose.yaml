# Used from the Makefile as docker compose -f docker/compose.yaml.
# Pin the project name. Dev Containers uses <folder name>_devcontainer by default, so without
# pinning, the volumes differ and node_modules gets created twice, once via the host and once via the editor
name: playmaker

x-base: &base
  build:
    context: ..
    dockerfile: docker/Dockerfile
  image: playmaker-dev
  # Mount the whole repository (the working directory is the Dockerfile's WORKDIR = library/).
  # The whole repository is mounted so that git and docs/ .claude/ can be handled from inside Dev Containers
  volumes:
    - ..:/workspace
    # node_modules is not shared with the host. The native binaries of esbuild / Biome differ
    # between darwin and linux, and heavy file I/O across a bind mount is slow
    - node_modules:/workspace/library/node_modules
    - pnpm-store:/home/node/.local/share/pnpm/store

services:
  # Runs Makefile tasks (docker compose run --rm) and is what Dev Containers attaches to
  workspace:
    <<: *base
    command: sleep infinity

  # dev server for the demo playground (make up / make down)
  dev:
    <<: *base
    command: pnpm run dev --host 0.0.0.0 --strictPort
    ports:
      - "5173:5173"
    environment:
      # In some environments (such as colima's default), edits on the host do not reach the container
      # via inotify, so pick them up by polling. The chokidar bundled with Vite reads this variable
      CHOKIDAR_USEPOLLING: "true"
    # make up is docker compose up --wait, which waits until this passes
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5173/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      start_period: 60s
      start_interval: 1s

volumes:
  node_modules:
  pnpm-store:
