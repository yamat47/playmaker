<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playmaker Playground</title>
    <style>
      /* A development playground, not the public demo (that is yamat47/playmaker-demo). The page
         stays unstyled on purpose, so the library's own UI is what gets looked at. */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 14px system-ui, sans-serif;
      }
      #app {
        display: flex;
        height: 100vh;
      }
      #stage {
        flex: 1;
        min-width: 0;
        margin: 12px;
      }
      .tools {
        width: 320px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 12px;
        overflow-y: auto;
        border-left: 1px solid #ddd;
        background: #f7f7f7;
      }
      .tools h1 {
        font-size: 16px;
        margin: 0;
      }
      .tools h2 {
        font-size: 12px;
        margin: 8px 0 0;
        color: #666;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .status {
        font-size: 12px;
        color: #555;
        min-height: 1.2em;
      }
      textarea {
        width: 100%;
        height: 220px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, monospace;
        resize: vertical;
      }
      select {
        max-width: 100%;
      }
      /* The public variables, set on an ancestor as a host would, to check the override path. */
      #app.themed {
        --playmaker-ui-accent: #6a1b9a;
        --playmaker-ui-font: Georgia, serif;
        --playmaker-line-route: #6a1b9a;
        --playmaker-player-color: #1565c0;
        --playmaker-selection: #00acc1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>
      <aside class="tools" aria-label="Developer tools">
        <h1>Playmaker Playground</h1>

        <h2>Editor</h2>
        <div class="row">
          <button id="mode-toggle" type="button"></button>
          <button id="export-png" type="button">Export PNG</button>
          <button id="clear" type="button">Clear</button>
        </div>
        <div class="row">
          <label>
            Locale
            <select id="locale"></select>
          </label>
          <span class="status">Rebuilds the editor with the current diagram</span>
        </div>
        <div class="row">
          <label><input id="theme-toggle" type="checkbox" /> Theme override</label>
          <span class="status">Sets --playmaker-* variables on the host and calls refresh()</span>
        </div>
        <p id="status" class="status"></p>

        <h2>Presets</h2>
        <div class="row">
          <label>
            Play
            <select id="play"></select>
          </label>
        </div>
        <div class="row">
          <label>
            Formation
            <select id="formation"></select>
          </label>
          <span class="status">Appends players, as a host's own picker would</span>
        </div>
        <div class="row">
          <button id="load-stress" type="button">Density stress</button>
          <span class="status">Circles and squares, 3 line kinds, straight and bezier, many waypoints</span>
        </div>

        <h2>PlayData JSON</h2>
        <div class="row">
          <button id="json-export" type="button">Export</button>
          <button id="json-import" type="button">Import (round trip)</button>
          <button id="json-legacy" type="button">Legacy blob without version</button>
          <button id="json-future" type="button">Future (v99) blob</button>
        </div>
        <p id="data-status" class="status"></p>
        <textarea id="json" spellcheck="false" aria-label="PlayData JSON"></textarea>
      </aside>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
