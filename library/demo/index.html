<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Playmaker Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&family=Saira+Condensed:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/page.css" />
    <style>
      /* このページがライブラリのホスト。公開の変数で、ライブラリの UI をページと同じ配色とフォントにする。 */
      #app {
        --playmaker-ui-font: var(--ui);
        --playmaker-ui-accent: var(--primary);

        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      /* 紙の上に置くボタンは、輪郭だけの primary。 */
      .drawer .btn {
        border: 1px solid color-mix(in srgb, var(--primary) 50%, transparent);
        color: var(--primary);
      }
      .drawer .btn:hover {
        border-color: var(--primary);
        background: var(--selected);
      }

      /* ---- 本体（左のリスト＋ステージ） ---- */
      .body {
        display: flex;
        flex: 1;
        min-height: 0;
      }

      .library {
        width: 300px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border-right: 1px solid var(--divider);
      }
      .library__scroll {
        flex: 1;
        overflow-y: auto;
        padding: 8px 0 16px;
      }
      .preset {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        font: inherit;
        padding: 8px 16px;
        border: 0;
        background: transparent;
        color: var(--ink);
        cursor: pointer;
        transition: background-color 0.15s;
      }
      .preset:hover {
        background: rgba(0, 0, 0, 0.04);
      }
      .preset.is-active {
        background: var(--selected);
        color: var(--primary);
      }
      .preset:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: -2px;
      }
      .preset__chip {
        flex-shrink: 0;
      }
      .preset__name {
        font-family: var(--display);
        font-weight: 500;
        font-size: 16px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* ---- 表示中のプレーのカード ---- */
      .playinfo {
        border-top: 1px solid var(--divider);
        background: var(--surface);
        padding: 14px 16px 16px;
      }
      .playinfo__eyebrow {
        font-size: 12px;
        color: var(--ink-dim);
      }
      .playinfo__name {
        font-family: var(--display);
        font-weight: 700;
        font-size: 22px;
        margin: 2px 0 8px;
      }
      .playinfo__meta {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 8px;
      }
      .playinfo__pers {
        font-size: 12px;
        color: var(--ink-dim);
      }
      .playinfo__summary {
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink);
        margin: 0;
      }

      /* ---- ステージ（フィールド） ---- */
      .stage-wrap {
        position: relative;
        flex: 1;
        min-width: 0;
      }
      #stage {
        position: absolute;
        inset: 12px;
      }

      /* ---- 開発者ドロワー ---- */
      .drawer {
        background: var(--surface);
        border-top: 1px solid var(--divider);
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.18s ease;
      }
      .drawer.is-open {
        max-height: 46vh;
        overflow-y: auto;
      }
      .drawer__inner {
        padding: 12px 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .drawer__row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
      }
      .drawer__label {
        font-weight: 500;
        font-size: 13px;
        color: var(--ink-dim);
        margin-right: 4px;
      }
      .drawer__status {
        font-size: 12px;
        color: var(--ink-dim);
      }
      .drawer textarea {
        width: 100%;
        height: 150px;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid rgba(0, 0, 0, 0.23);
        border-radius: 4px;
        padding: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        resize: vertical;
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .preset {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand__name">Playmaker</span>
          <span class="brand__tag">プレー図デザイナー — デモ</span>
        </div>
        <div class="topbar__spacer"></div>
        <div class="topbar__actions">
          <a class="btn" href="/gallery.html">プリセット一覧</a>
          <button id="mode-toggle" class="btn" type="button">view モードへ</button>
          <button id="clear" class="btn" type="button">クリア</button>
          <button id="export-png" class="btn" type="button">PNG 出力</button>
          <button id="dev-toggle" class="btn" type="button" aria-pressed="false">開発者</button>
        </div>
      </header>

      <div class="body">
        <aside class="library">
          <div id="library-scroll" class="library__scroll"></div>
          <div class="playinfo">
            <div class="playinfo__eyebrow">Now showing</div>
            <div id="playinfo-name" class="playinfo__name">—</div>
            <div class="playinfo__meta">
              <span id="playinfo-chip" class="chip" hidden></span>
              <span id="playinfo-pers" class="playinfo__pers"></span>
            </div>
            <p id="playinfo-summary" class="playinfo__summary"></p>
          </div>
        </aside>

        <main class="stage-wrap">
          <div id="stage"></div>
        </main>
      </div>

      <section id="drawer" class="drawer" aria-label="開発者ツール">
        <div class="drawer__inner">
          <div class="drawer__row">
            <span class="drawer__label">Fixtures</span>
            <button id="load-stress" class="btn" type="button">密度ストレス</button>
            <span id="status" class="drawer__status"></span>
          </div>
          <div class="drawer__row">
            <span class="drawer__label">PlayData JSON</span>
            <button id="json-export" class="btn" type="button">書き出す</button>
            <button id="json-import" class="btn" type="button">読み込む（往復）</button>
            <button id="json-legacy" class="btn" type="button">版なし旧 blob</button>
            <button id="json-future" class="btn" type="button">未来版(v99) blob</button>
            <span id="data-status" class="drawer__status"></span>
          </div>
          <textarea id="json" spellcheck="false" aria-label="PlayData JSON"></textarea>
        </div>
      </section>
    </div>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
